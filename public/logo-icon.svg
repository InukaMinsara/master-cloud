<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <!-- Gradients matching the official design -->
    <linearGradient id="cloudNavyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#003594" />
      <stop offset="100%" stop-color="#0066cc" />
    </linearGradient>

    <linearGradient id="cloudCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>

    <linearGradient id="mLeftFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#002d72" />
      <stop offset="100%" stop-color="#0052b4" />
    </linearGradient>

    <linearGradient id="mRightFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <!-- Left Cloud Ring / Loop (Navy) -->
  <path d="M 190 140 A 65 65 0 0 0 80 180 A 60 60 0 0 0 80 300 L 220 300 A 30 30 0 0 0 220 240 L 165 240 A 35 35 0 0 1 165 170 A 35 35 0 0 1 200 190 Z"
        fill="url(#cloudNavyGrad)" />

  <!-- Top-Right Cloud Loop (Sky Cyan) -->
  <path d="M 230 110 A 85 85 0 0 1 370 190 A 65 65 0 0 1 420 300 L 290 300 A 30 30 0 0 1 290 240 L 345 240 A 35 35 0 0 0 345 170 A 45 45 0 0 0 270 140 Z"
        fill="url(#cloudCyanGrad)" opacity="0.9" />

  <!-- Embedded Central Stylized 'M' Mark -->
  <!-- Left Leg of M -->
  <path d="M 120 300 L 175 160 L 235 245 L 205 285 L 175 245 L 145 300 Z"
        fill="url(#mLeftFacet)" />

  <!-- Right Leg of M with 3D Overlap -->
  <path d="M 235 245 L 295 160 L 350 300 L 305 300 L 275 230 L 245 270 Z"
        fill="url(#mRightFacet)" />

  <!-- Center Vertex Shading -->
  <polygon points="235,245 205,285 245,270" fill="#00439c" opacity="0.85" />
</svg>
