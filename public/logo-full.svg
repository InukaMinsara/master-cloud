<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="100%" height="100%">
  <defs>
    <linearGradient id="cloudNavyGradFull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#003594" />
      <stop offset="100%" stop-color="#0066cc" />
    </linearGradient>

    <linearGradient id="cloudCyanGradFull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>

    <linearGradient id="mLeftFacetFull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#002d72" />
      <stop offset="100%" stop-color="#0052b4" />
    </linearGradient>

    <linearGradient id="mRightFacetFull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <!-- Left Icon Group -->
  <g transform="translate(10, 10) scale(0.85)">
    <!-- Left Cloud Loop -->
    <path d="M 190 140 A 65 65 0 0 0 80 180 A 60 60 0 0 0 80 300 L 220 300 A 30 30 0 0 0 220 240 L 165 240 A 35 35 0 0 1 165 170 A 35 35 0 0 1 200 190 Z"
          fill="url(#cloudNavyGradFull)" />

    <!-- Top-Right Cloud Loop -->
    <path d="M 230 110 A 85 85 0 0 1 370 190 A 65 65 0 0 1 420 300 L 290 300 A 30 30 0 0 1 290 240 L 345 240 A 35 35 0 0 0 345 170 A 45 45 0 0 0 270 140 Z"
          fill="url(#cloudCyanGradFull)" opacity="0.9" />

    <!-- Central Stylized 'M' Mark -->
    <path d="M 120 300 L 175 160 L 235 245 L 205 285 L 175 245 L 145 300 Z"
          fill="url(#mLeftFacetFull)" />

    <path d="M 235 245 L 295 160 L 350 300 L 305 300 L 275 230 L 245 270 Z"
          fill="url(#mRightFacetFull)" />

    <polygon points="235,245 205,285 245,270" fill="#00439c" opacity="0.85" />
  </g>

  <!-- Right Typography Wordmark -->
  <text x="430" y="175"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="105"
        font-weight="900"
        letter-spacing="1"
        fill="#002f87">MASTER</text>

  <text x="430" y="275"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="105"
        font-weight="900"
        letter-spacing="2"
        fill="#42c2f7">CLOUD</text>
</svg>
