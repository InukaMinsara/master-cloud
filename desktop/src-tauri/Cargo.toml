[package]
name = "master-cloud-desktop"
version = "1.0.0"
description = "Master Cloud Desktop Client — Virtual drive for Windows"
authors = ["Master Cloud"]
edition = "2021"
rust-version = "1.70"

# See more keys and definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "master_cloud_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "master-cloud-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# ── Tauri ──────────────────────────────────────────────────────────────────
tauri = { version = "2", features = [
  "tray-icon",
  "image-png",
] }
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
tauri-plugin-oauth = "2"
tauri-plugin-store = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-deep-link = "2"

# ── Async runtime ──────────────────────────────────────────────────────────
tokio = { version = "1", features = ["full"] }

# ── HTTP / Cloud API ───────────────────────────────────────────────────────
reqwest = { version = "0.12", features = [
  "json",
  "stream",
  "rustls-tls",
] }
url = "2"

# ── Serialisation ─────────────────────────────────────────────────────────
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ── Filesystem / OS ────────────────────────────────────────────────────────
winfsp-sys = { version = "0.3", optional = true }          # WinFsp raw bindings
notify = { version = "6", features = ["macos-kqueue"] }    # FS watcher
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
tempfile = "3"

# ── Windows-specific ──────────────────────────────────────────────────────
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Security_Credentials",
  "Win32_System_Registry",
  "Win32_System_Com",
  "Win32_UI_Shell",
  "Win32_Storage_FileSystem",
] }
winreg = "0.52"

# ── Logging ────────────────────────────────────────────────────────────────
log = "0.4"
env_logger = "0.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# ── Error handling ────────────────────────────────────────────────────────
anyhow = "1"
thiserror = "1"

# ── Concurrency / queue ───────────────────────────────────────────────────
crossbeam-channel = "0.5"
dashmap = "6"
parking_lot = "0.12"
bytes = "1"
futures = "0.3"
async-trait = "0.1"

# ── Persistence ───────────────────────────────────────────────────────────
rusqlite = { version = "0.31", features = ["bundled"] }

[features]
default = ["custom-protocol", "winfsp"]
custom-protocol = ["tauri/custom-protocol"]
winfsp = ["winfsp-sys"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = 3
strip = true
