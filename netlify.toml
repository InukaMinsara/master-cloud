[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Custom headers to override external CSP and enable universal cross-origin streaming
[[headers]]
  for = "/api/litter-stream/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cross-Origin-Resource-Policy = "cross-origin"
    Content-Security-Policy = "default-src * 'unsafe-inline' 'unsafe-eval' data: blob:; media-src * data: blob:;"

[[headers]]
  for = "/api/catbox-stream/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cross-Origin-Resource-Policy = "cross-origin"
    Content-Security-Policy = "default-src * 'unsafe-inline' 'unsafe-eval' data: blob:; media-src * data: blob:;"

[[headers]]
  for = "/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"

# Direct Cloud Media Streaming & Download Proxies (Bypasses CORP same-site and browser CORS)
[[redirects]]
  from = "/api/litter-stream/:file"
  to = "https://litter.catbox.moe/:file"
  status = 200
  force = true

[[redirects]]
  from = "/api/catbox-stream/:file"
  to = "https://files.catbox.moe/:file"
  status = 200
  force = true

# API proxies to bypass browser CORS for cloud uploads
[[redirects]]
  from = "/api/telegram-proxy/*"
  to = "https://api.telegram.org/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/catbox-proxy/*"
  to = "https://catbox.moe/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/litterbox-proxy/*"
  to = "https://litterbox.catbox.moe/:splat"
  status = 200
  force = true

# SPA client-side routing fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
