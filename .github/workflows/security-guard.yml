name: Master Cloud Zero-Leak Security Guard

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  secret-audit:
    name: Audit Secrets & Credential Leak Prevention
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Master Cloud Security Shield
        run: node scripts/security-shield.mjs --all
